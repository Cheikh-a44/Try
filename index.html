<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفتر الدين</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div id="homeScreen" class="screen active">
    <header class="app-header">
      <h1>دفتر الدين</h1>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن اسم...">
    </div>

    <div id="peopleList" class="people-list"></div>

    <button id="addPersonBtn" class="fab">+</button>
  </div>

  <!-- شاشة الدين -->
  <div id="personScreen" class="screen">
    <header class="app-header">
      <button id="backBtn" class="back-btn">→</button>
      <h1 id="personName"></h1>
    </header>

    <div id="debtList" class="debt-list"></div>

    <div class="bottom-actions">
      <button id="addDebtBtn" class="fab">+</button>
      <button id="calcBtn" class="calc-btn">حساب الجميع</button>
    </div>
  </div>

  <!-- نافذة إدخال الاسم -->
  <div id="nameModal" class="modal">
    <div class="modal-content">
      <h3>إضافة شخص جديد</h3>
      <input type="text" id="newNameInput" placeholder="اكتب الاسم">
      <div class="modal-buttons">
        <button id="cancelName" class="btn-cancel">إلغاء</button>
        <button id="confirmName" class="btn-confirm">تم</button>
      </div>
    </div>
  </div>

  <!-- نافذة اختيار نوع الدين -->
  <div id="typeModal" class="modal">
    <div class="modal-content">
      <h3>نوع الدين</h3>
      <div class="modal-buttons column">
        <button id="cashBtn" class="type-btn">💵 سيولة</button>
        <button id="tradeBtn" class="type-btn">📦 تجارة</button>
        <button id="cancelType" class="btn-cancel">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة إدخال سيولة -->
  <div id="cashModal" class="modal">
    <div class="modal-content">
      <h3>إدخال سيولة</h3>
      <input type="number" id="cashAmount" placeholder="الرقم">
      <div class="modal-buttons">
        <button id="cancelCash" class="btn-cancel">إلغاء</button>
        <button id="confirmCash" class="btn-confirm">تم</button>
      </div>
    </div>
  </div>

  <!-- نافذة إدخال تجارة -->
  <div id="tradeModal" class="modal">
    <div class="modal-content">
      <h3>إدخال تجارة</h3>
      <input type="number" id="tradeQty" placeholder="العدد">
      <input type="number" id="tradePrice" placeholder="سعر الواحد">
      <div class="modal-buttons">
        <button id="cancelTrade" class="btn-cancel">إلغاء</button>
        <button id="confirmTrade" class="btn-confirm">تم</button>
      </div>
    </div>
  </div>

  <!-- نافذة الحساب -->
  <div id="resultModal" class="modal">
    <div class="modal-content result-content">
      <div id="resultArea" class="result-area"></div>
      <div class="modal-buttons">
        <button id="closeResult" class="btn-confirm">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
